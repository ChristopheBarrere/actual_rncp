<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course.title }}</title>
</head>
<body>

    <h1>{{ course.title }}</h1>

    <p>
        {{ course.description }}
    </p>

    <p>
        Coach : {{ course.coach }}
    </p>

    <p>
        Date : {{ course.start_at }}
    </p>

    <p>
        Durée : {{ course.duration_minutes }} minutes
    </p>

    <p>
        Nombre de places : {{ course.capacity }}
    </p>

    {% if course.is_cancelled %}

        <p>Ce cours est annulé.</p>

    {% endif %}

    <a href="{% url 'course_list' %}">

        Retour au planning

    </a>
    
</body>
</html>
