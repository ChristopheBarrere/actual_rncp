{% extends 'base.html' %}

{% block title %}Inscription — Actual{% endblock %}

{% block content %}

    <section class="card auth-card">

        <div class="card-body p-4 p-lg-5">

            <h1 class="h2 mb-3">Créer un compte</h1>

            <p class="text-secondary mb-4">
                Créez votre compte pour réserver un cours.
            </p>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    class="btn btn-actual w-100"
                    type="submit"
                >
                    S’inscrire
                </button>

            </form>

            <p class="mt-4 mb-0">
                Vous possédez déjà un compte ?

                <a href="{% url 'login' %}">
                    Se connecter
                </a>
            </p>

        </div>

    </section>

{% endblock %}
