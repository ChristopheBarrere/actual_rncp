{% extends 'base.html' %}

{% block title %}Connexion — Actual{% endblock %}

{% block content %}

    <section class="card auth-card">

        <div class="card-body p-4 p-lg-5">

            <h1 class="h2 mb-3">Se connecter</h1>

            <p class="text-secondary mb-4">
                Connectez-vous pour réserver vos prochains cours.
            </p>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    class="btn btn-actual w-100"
                    type="submit"
                >
                    Se connecter
                </button>

            </form>

            <p class="mt-4 mb-0">
                Vous n’avez pas encore de compte ?

                <a href="{% url 'register' %}">
                    S’inscrire
                </a>
            </p>

        </div>

    </section>

{% endblock %}
